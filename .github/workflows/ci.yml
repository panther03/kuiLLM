name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Kuiops
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fstarlang/kuiper-base-nocuda:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean runner workspace
        run: find . -delete

      - uses: actions/checkout@v6

      - name: Read Kuiper package pin
        id: kuiper
        run: echo "nightly=$(make -s print-kuiper-nightly)" >> "$GITHUB_OUTPUT"

      - name: Set up build environment
        run: |
          echo "HOME=/home/vscode" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Restore Kuiper package
        uses: actions/cache@v5
        with:
          path: .kuiper
          key: kuiper-nightly-${{ steps.kuiper.outputs.nightly }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare pinned toolchain
        run: make -j2 prepare

      - name: Verify local modules
        run: |
          jobs=$(scripts/ci-jobs.sh 3072)
          echo "Verifying with $jobs job(s)."
          make -j"$jobs" verify-kuiops
